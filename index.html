<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TwoSuns</title>
  <meta name="description" content="TwoSuns.ai is temporarily unavailable while we make updates.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/logo-mini.svg">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;
      background:linear-gradient(160deg,#FFF5DD 0%,#FFF3CD 35%,#FCE2BC 100%);
      font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#3A3A3A;text-align:center;}
    .card{max-width:560px;}
    img{width:300px;max-width:78%;height:auto;display:block;margin:0 auto 34px;}
    h1{font-size:clamp(26px,4vw,38px);font-weight:800;color:#1E1A14;line-height:1.2;margin-bottom:16px;}
    p{font-size:17px;line-height:1.75;color:#5A554C;margin-bottom:12px;}
    .rule{height:2px;border:0;margin:32px auto;max-width:260px;border-radius:2px;
      background:linear-gradient(90deg,transparent,#E0641E 30%,#CC9900 50%,#E0641E 70%,transparent);}
    a{color:#C45213;font-weight:700;text-decoration:none;}
    a:hover{text-decoration:underline;}
    .tag{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9A7209;}
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo-color.svg" alt="TwoSuns">
    <p class="tag">Temporarily Unavailable</p>
    <hr class="rule">
    <h1>We are making some updates</h1>
    <p>TwoSuns.ai is briefly offline while we work on the site. It will be back shortly.</p>
    <p>In the meantime, reach us at <a href="mailto:info@twosuns.ai">info@twosuns.ai</a>.</p>
  </div>
</body>
</html>
